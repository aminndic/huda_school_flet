name: Build Flet Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. إعداد بيئة Java SDK (مطلوبة لبناء Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. تثبيت Flet وتحديث الأدوات
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flet

      # 5. بناء الـ APK (استخدام echo "y" لتجاوز سؤال الموافقة على تنزيل Flutter)
      - name: Build Android APK
        run: |
          echo "y" | flet build apk --vv

      # 6. رفع ملف الـ APK الناتج كـ Artifact للتنزيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
